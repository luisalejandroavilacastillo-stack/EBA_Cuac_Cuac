# Nginx del frontend en Docker.
#   /             prototipo EBA Cuac Cuac v0.24 (todas las pantallas)
#   /plataforma/  versión Angular que se va construyendo módulo por módulo
#   /api/         se reenvía a la API Express (servicio «api», puerto 3085)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://api:3085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
  }

  # Angular: los archivos llevan un nombre único en cada compilación y se pueden guardar en caché.
  location ^~ /plataforma/ {
    location ~* \.(?:js|css|woff2?|ttf)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    try_files $uri $uri/ /plataforma/index.html;
    add_header Cache-Control "no-store";
  }

  # Prototipo: sus archivos no cambian de nombre, así que el navegador siempre pregunta si hay versión nueva.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
