# Nginx del frontend en Docker.
#   /plataforma/  plataforma EBA Cuac Cuac (Angular)
#   /api/         se reenvía a la API Express (servicio «api», puerto 3085)
#   /             lleva a /plataforma/. El prototipo v0.25 ya no se publica; solo se incluye si la imagen se construye
#                 con CON_PROTOTIPO=si (pruebas que comparan con él).
# Los enlaces de un solo uso (activar cuenta, restablecer contraseña) no se escriben en el registro de accesos.
# Política de contenido de la plataforma: solo código propio (Angular pone estilos en línea en los componentes).
map $uri $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
map $request_uri $registrar_acceso {
  ~*/(activar|restablecer|enlace)/ 0;
  default 1;
}

server {
  listen 80;
  access_log /var/log/nginx/access.log combined if=$registrar_acceso;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  server_tokens off;
  # Redirecciones relativas: conservan el puerto con el que se abrió (4200), aunque Nginx escuche en el 80 del contenedor.
  absolute_redirect off;
  include /etc/nginx/snippets/seguridad.conf;

  location /api/ {
    proxy_pass http://api:3085;
    proxy_http_version 1.1;
    # Dirección con puerto (localhost:4200 o IP:4200): la API la compara con el origen de cada cambio (protección CSRF).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
  }

  location ^~ /plataforma/ {
    # Trabajo sin señal: el service worker y su índice se revisan siempre (si no, el equipo no recibe versiones nuevas).
    location ~ ^/plataforma/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
      try_files $uri =404;
      include /etc/nginx/snippets/seguridad.conf;
      add_header Content-Security-Policy $csp always;
      add_header Cache-Control "no-cache";
    }
    # Los demás archivos llevan un nombre único en cada compilación y se pueden guardar en caché.
    location ~* \.(?:js|css|woff2?|ttf)$ {
      try_files $uri =404;
      include /etc/nginx/snippets/seguridad.conf;
      add_header Content-Security-Policy $csp always;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    try_files $uri $uri/ /plataforma/index.html;
    include /etc/nginx/snippets/seguridad.conf;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-store";
  }

  # Prototipo (solo si la imagen lo trae); si no, todo lleva a la plataforma.
  location = / {
    try_files /index.html @plataforma;
    include /etc/nginx/snippets/seguridad.conf;
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri @plataforma;
    include /etc/nginx/snippets/seguridad.conf;
    add_header Cache-Control "no-cache";
  }
  location @plataforma {
    return 302 /plataforma/;
  }
}
